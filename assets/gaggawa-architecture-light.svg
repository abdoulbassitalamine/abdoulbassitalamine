<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title">
  <title id="title">Gaggawa architecture: Flutter app, Quasar admin and Nuxt site; Laravel 12 API with a Spring Boot rewrite in progress; PostgreSQL, Redis, S3 storage and Centrifugo; deployed with Docker Compose, GitHub Actions and Prometheus/Grafana monitoring</title>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #14121A; }
    .muted { fill: #55515F; }
    .faint { fill: #8F8A9C; }
    .accent { fill: #6D28D9; }
    .edge { fill: none; stroke: #E4E0EC; stroke-width: 1.5; }
    .route { fill: none; stroke: #8F8A9C; stroke-width: 1.75; }
    .edge-accent { fill: none; stroke: #7C3AED; stroke-width: 1.5; }
    .box { fill: #FFFFFF; stroke: #E4E0EC; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8F8A9C"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1200" height="530" rx="24" fill="#FBFAFD"/>
  <rect x=".5" y=".5" width="1199" height="529" rx="23.5" fill="none" stroke="#E4E0EC"/>
  <text x="40" y="62" class="mono muted" font-size="14" letter-spacing="2">CLIENTS</text>
  <text x="435" y="62" class="mono muted" font-size="14" letter-spacing="2">API</text>
  <text x="830" y="62" class="mono muted" font-size="14" letter-spacing="2">DATA &amp; MESSAGING</text>
  <rect class="box" x="40" y="84" width="330" height="118" rx="12"/>
  <text x="60" y="114" class="sans text" font-size="17" font-weight="600">Mobile app</text>
  <text x="60" y="140" class="mono muted" font-size="15">Flutter · client + courier roles</text>
  <text x="60" y="162" class="mono muted" font-size="15">Riverpod · go_router · Freezed</text>
  <text x="60" y="184" class="mono muted" font-size="15">Firebase messaging</text>
  <rect class="box" x="40" y="218" width="330" height="80" rx="12"/>
  <text x="60" y="248" class="sans text" font-size="17" font-weight="600">Admin console</text>
  <text x="60" y="274" class="mono muted" font-size="15">Quasar (Vue) · OpenAPI client</text>
  <rect class="box" x="40" y="314" width="330" height="80" rx="12"/>
  <text x="60" y="344" class="sans text" font-size="17" font-weight="600">Marketing site</text>
  <text x="60" y="370" class="mono muted" font-size="15">Nuxt · gaggawa.com</text>
  <rect class="box" x="435" y="84" width="330" height="96" rx="12"/>
  <text x="455" y="114" class="sans text" font-size="17" font-weight="600">Laravel 12 API</text>
  <text x="455" y="140" class="mono muted" font-size="15">REST · JWT auth</text>
  <text x="455" y="162" class="mono muted" font-size="15">Octane · Horizon queues</text>
  <rect class="box" x="435" y="214" width="330" height="80" rx="12" style="stroke: #7C3AED; stroke-dasharray: 5 5;"/>
  <text x="455" y="244" class="sans accent" font-size="17" font-weight="600">Spring Boot API</text>
  <text x="455" y="270" class="mono muted" font-size="15">rewrite in progress</text>
  <rect class="box" x="830" y="84" width="330" height="60" rx="12"/>
