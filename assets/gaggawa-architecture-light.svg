  <text x="1140" y="121" text-anchor="end" class="mono muted" font-size="15">relational data</text>
  <rect class="box" x="830" y="162" width="330" height="60" rx="12"/>
  <text x="850" y="199" class="sans text" font-size="17" font-weight="600">Redis</text>
  <text x="1140" y="199" text-anchor="end" class="mono muted" font-size="15">cache · queues</text>
