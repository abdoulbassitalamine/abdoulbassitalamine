  <path class="route" d="M765,144 C800,144 795,270 830,270" marker-end="url(#arrow)"/>
  <path class="route" d="M765,164 C800,164 795,348 830,348" marker-end="url(#arrow)"/>
  <path d="M600,180 V214" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path class="edge-accent" d="M995,378 V404 Q995,420 979,420 H418 Q402,420 402,404 V176 Q402,160 386,160 H374" stroke-dasharray="4 5" marker-end="url(#arrow-accent)"/>
  <text x="420" y="411" class="mono accent" font-size="15">realtime events → app (WebSocket)</text>
  <rect x="40" y="446" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E0EC"/>
  <text x="64" y="479" class="mono" font-size="15"><tspan class="accent" letter-spacing="2">RUNS ON</tspan><tspan class="muted" dx="20">Docker Compose on a VPS · GitHub Actions · Cloudflare Tunnel · Prometheus + Grafana</tspan></text>
</svg>
