  <text x="850" y="277" class="sans text" font-size="17" font-weight="600">Object storage</text>
  <text x="1140" y="277" text-anchor="end" class="mono muted" font-size="15">S3 · MinIO</text>
  <rect class="box" x="830" y="318" width="330" height="60" rx="12"/>
  <text x="850" y="355" class="sans text" font-size="17" font-weight="600">Centrifugo</text>
  <text x="1140" y="355" text-anchor="end" class="mono muted" font-size="15">realtime pub/sub</text>
