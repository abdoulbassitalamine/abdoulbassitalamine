    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #14121A; }
    .muted { fill: #55515F; }
    .faint { fill: #8F8A9C; }
    .accent { fill: #6D28D9; }
    .edge { fill: none; stroke: #E4E0EC; stroke-width: 1.5; }
    .route { fill: none; stroke: #8F8A9C; stroke-width: 1.75; }
    .edge-accent { fill: none; stroke: #7C3AED; stroke-width: 1.5; }
    .box { fill: #FFFFFF; stroke: #E4E0EC; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>
