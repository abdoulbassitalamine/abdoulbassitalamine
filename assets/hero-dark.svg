<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title">
  <title id="title">Abdoul Bassit Laminou Amadou, Software Engineer: mobile apps and the backends behind them</title>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #F4F3F7; }
    .muted { fill: #A29EAE; }
    .faint { fill: #625E6E; }
    .accent { fill: #A78BFA; }
    .edge { fill: none; stroke: #272331; stroke-width: 1.5; }
    .route { fill: none; stroke: #625E6E; stroke-width: 1.75; }
    .edge-accent { fill: none; stroke: #8B5CF6; stroke-width: 1.5; }
    .box { fill: #13111A; stroke: #272331; stroke-width: 1; }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1E1B27"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0A10" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0B0A10" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0B0A10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#0B0A10"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="24" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="23.5" fill="none" stroke="#272331"/>
  <rect x="72" y="72" width="28" height="3" rx="1.5" fill="#8B5CF6"/>
  <text x="72" y="102" class="mono muted" font-size="14" letter-spacing="2.5">ÎLE-DE-FRANCE</text>
  <text x="68" y="176" class="sans text" font-size="64" font-weight="700" letter-spacing="-1.8">Abdoul Bassit</text>
  <text x="71" y="216" class="sans muted" font-size="26" font-weight="500" letter-spacing="-.3">Laminou Amadou</text>
  <text x="72" y="276" class="sans text" font-size="23" font-weight="500">Software Engineer <tspan class="accent">—</tspan> mobile apps and the backends behind them</text>
</svg>
