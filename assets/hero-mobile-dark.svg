<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title">
  <title id="title">Abdoul Bassit Laminou Amadou, Software Engineer: mobile apps and the backends behind them</title>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #F4F3F7; }
    .muted { fill: #A29EAE; }
    .faint { fill: #625E6E; }
    .accent { fill: #A78BFA; }
    .edge { fill: none; stroke: #272331; stroke-width: 1.5; }
    .route { fill: none; stroke: #625E6E; stroke-width: 1.75; }
    .edge-accent { fill: none; stroke: #8B5CF6; stroke-width: 1.5; }
    .box { fill: #13111A; stroke: #272331; stroke-width: 1; }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1E1B27"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0A10" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0B0A10" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0B0A10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" rx="24" fill="#0B0A10"/>
  <rect width="600" height="420" rx="24" fill="url(#grid)"/>
  <rect width="600" height="420" rx="24" fill="url(#fade)"/>
  <rect x=".5" y=".5" width="599" height="419" rx="23.5" fill="none" stroke="#272331"/>
  <rect x="48" y="58" width="32" height="4" rx="2" fill="#8B5CF6"/>
  <text x="48" y="96" class="mono muted" font-size="20" letter-spacing="2.5">ÎLE-DE-FRANCE</text>
  <text x="44" y="172" class="sans text" font-size="64" font-weight="700" letter-spacing="-1.8">Abdoul Bassit</text>
  <text x="47" y="216" class="sans muted" font-size="32" font-weight="500" letter-spacing="-.3">Laminou Amadou</text>
  <text x="48" y="280" class="sans text" font-size="30" font-weight="600">Software Engineer</text>
  <text x="48" y="320" class="sans text" font-size="28">Mobile apps and</text>
  <text x="48" y="358" class="sans text" font-size="28">the backends behind them</text>
