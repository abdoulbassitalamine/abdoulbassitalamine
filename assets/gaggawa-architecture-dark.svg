<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title">
  <title id="title">Gaggawa architecture: Flutter app, Quasar admin and Nuxt site; Laravel 12 API with a Spring Boot rewrite in progress; PostgreSQL, Redis, S3 storage and Centrifugo; deployed with Docker Compose, GitHub Actions and Prometheus/Grafana monitoring</title>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .text { fill: #F4F3F7; }
    .muted { fill: #A29EAE; }
    .faint { fill: #625E6E; }
    .accent { fill: #A78BFA; }
    .edge { fill: none; stroke: #272331; stroke-width: 1.5; }
    .edge-accent { fill: none; stroke: #8B5CF6; stroke-width: 1.5; }
    .box { fill: #13111A; stroke: #272331; stroke-width: 1; }
    .pulse-node { animation: breathe 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } .pulse-node { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#625E6E"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8B5CF6"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="#0B0A10"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="23.5" fill="none" stroke="#272331"/>
