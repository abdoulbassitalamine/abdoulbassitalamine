  <path class="edge" d="M745,200 C830,200 790,318 870,318" marker-end="url(#arrow)"/>
  <path d="M600,230 V262" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path class="edge-accent" d="M1015,346 V376 Q1015,394 997,394 H398 Q380,394 380,376 V172 Q380,156 364,156 H336" stroke-dasharray="4 5" marker-end="url(#arrow-accent)"/>
  <text x="410" y="386" class="mono accent" font-size="12">realtime events → app (WebSocket)</text>
  <rect x="40" y="420" width="1120" height="52" rx="12" fill="#13111A" stroke="#272331"/>
  <text x="62" y="451" class="mono" font-size="12.5"><tspan class="accent" letter-spacing="2">RUNS ON</tspan><tspan class="muted" dx="18">Docker Compose on a VPS · GHCR images · GitHub Actions CI/CD · Nginx · Cloudflare Tunnel · Prometheus · Grafana · Alertmanager</tspan></text>
