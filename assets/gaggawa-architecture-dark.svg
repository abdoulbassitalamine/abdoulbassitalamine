  <text x="888" y="250" class="sans text" font-size="16" font-weight="600">Object storage</text>
  <rect class="box" x="870" y="290" width="290" height="56" rx="12"/>
  <text x="888" y="318" class="sans text" font-size="16" font-weight="600">Centrifugo</text>
  <text x="1142" y="114" text-anchor="end" class="mono faint" font-size="12">relational data</text>
  <text x="1142" y="182" text-anchor="end" class="mono faint" font-size="12">cache · queues</text>
  <text x="1142" y="250" text-anchor="end" class="mono faint" font-size="12">S3 · MinIO</text>
  <text x="1142" y="318" text-anchor="end" class="mono faint" font-size="12">realtime pub/sub</text>
