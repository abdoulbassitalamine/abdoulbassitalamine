  <text x="455" y="66" class="mono faint" font-size="12" letter-spacing="2">API</text>
  <text x="870" y="66" class="mono faint" font-size="12" letter-spacing="2">DATA &amp; MESSAGING</text>
  <rect class="box" x="40" y="86" width="290" height="100" rx="12"/>
  <text x="58" y="114" class="sans text" font-size="16" font-weight="600">Mobile app</text>
  <text x="58" y="136" class="mono muted" font-size="12.5">Flutter · client + courier roles</text>
  <text x="58" y="156" class="mono muted" font-size="12.5">Riverpod · go_router · Freezed</text>
  <text x="58" y="176" class="mono muted" font-size="12.5">Firebase messaging</text>
  <rect class="box" x="40" y="204" width="290" height="74" rx="12"/>
  <text x="58" y="232" class="sans text" font-size="16" font-weight="600">Admin console</text>
  <text x="58" y="254" class="mono muted" font-size="12.5">Quasar (Vue) · OpenAPI client</text>
  <rect class="box" x="40" y="296" width="290" height="74" rx="12"/>
  <text x="58" y="324" class="sans text" font-size="16" font-weight="600">Marketing site</text>
  <text x="58" y="346" class="mono muted" font-size="12.5">Nuxt · gaggawa.com</text>
