  <text x="473" y="156" class="mono muted" font-size="12.5">Octane · Horizon queues</text>
  <text x="473" y="176" class="mono muted" font-size="12.5">scheduler · Sentry</text>
  <rect class="box" x="455" y="262" width="290" height="74" rx="12" style="stroke: #8B5CF6; stroke-dasharray: 5 5;"/>
  <text x="473" y="290" class="sans accent" font-size="16" font-weight="600">Spring Boot API</text>
  <text x="473" y="312" class="mono muted" font-size="12.5">rewrite in progress</text>
  <rect class="box" x="870" y="86" width="290" height="56" rx="12"/>
